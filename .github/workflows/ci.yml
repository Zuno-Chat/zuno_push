# Same checks as `make check` plus the contract tests on SQLite and Postgres.
# Actions are pinned to commit SHAs; the comment is the tag that SHA was.
# Each suite uploads its coverage to Codecov (flags unit and contract), which
# merges them: only the contract tests reach src/internals.py.
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13" # the Synapse image's interpreter
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check src unit_tests contract_tests
      - run: ruff check src unit_tests contract_tests
      - run: python -m coverage run -m twisted.trial unit_tests
      - run: python -m coverage xml
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          flags: unit

  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Contract tests
        env:
          ZUNO_CONTRACT_COVERAGE: "1"
        run: |
          if [ "${{ matrix.database }}" = postgres ]; then
            export SYNAPSE_POSTGRES=1 SYNAPSE_POSTGRES_HOST=127.0.0.1 SYNAPSE_POSTGRES_PORT=5432 SYNAPSE_POSTGRES_USER=postgres
          fi
          scripts/contract-tests.sh
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-contract.xml
          disable_search: true
          flags: contract
          name: contract-${{ matrix.database }}

  # A v* tag publishes ghcr.io/zuno-chat/zuno-push-wheel:<tag> for the docker
  # repo's Synapse image. That repo reads it with its own GITHUB_TOKEN once
  # the package grants it read access (package settings > Manage Actions
  # access).
  wheel:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, contract]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tag matches pyproject version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != pyproject v$version"; exit 1; }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: wheel.Dockerfile
          # Both platforms the Synapse image is built for; COPY --from pulls
          # the variant matching the target.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/zuno-chat/zuno-push-wheel:${{ github.ref_name }}
          provenance: false
